[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiantu-text-cultivation"
version = "1.0.0"
description = "A data-driven Chinese text cultivation game with Web, desktop, and terminal frontends."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4",
]

[project.optional-dependencies]
build = [
  "PyInstaller==6.13.0",
]

[tool.setuptools]
py-modules = [
  "achievement_system",
  "app",
  "game",
  "launcher",
  "playability",
  "save_manager",
  "server",
  "story_editor",
  "story_tools",
  "theme_tokens",
]

[tool.setuptools.packages.find]
include = ["xiantu*"]
