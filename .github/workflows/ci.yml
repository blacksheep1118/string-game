name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: PYTHONPYCACHEPREFIX=/tmp/xiantu-pycache python -m compileall -q .
      - name: Story validation
        run: python story_tools.py validate
      - name: Story quality report
        run: python story_tools.py quality
      - name: Frontend syntax
        run: node --check static/app.js && node --check static/service-worker.js
      - name: Launcher help
        run: python launcher.py --help && python server.py --help
      - name: Unit tests
        run: python -m unittest discover -s tests

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Build desktop bundle
        run: python -m PyInstaller --noconfirm XianTu.spec
